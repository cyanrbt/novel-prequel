# 运行时权威风格源：描述高层叙事特征，不提供可复制原文句式。
schema: novel-prequel-style

narrative:
  person: 第三人称限知
  pov: 张洞单一视角
  tone: [直接, 有连载感, 具体, 不完整认知, 适度现代口语]
  distance: "贴近张洞当下的注意力，而不只限制叙述者知道多少；读者既要看见他看见的东西，也要感觉到他的愿望、偏见和难堪怎样筛选这些东西。"
  voice: "叙述语言允许沾上张洞的年龄、处境与手艺经验，但不把每个比喻都写成木工术语，也不把他写成冷静的现场记录员。"
  information_order: "异常事实、人物假说、行动试错、现实后果与临时结论构成一条规则线；它们可以跨数章分布，单章不必机械走完闭环。"
  reader_priority: "人物愿望受阻、被迫选择、现实代价、问题升级优先于背景完整和异常排查；连续性账本留在幕后。"
  forbidden_shortcuts:
    - 上帝视角和远处切镜
    - 叙述者直接宣布规则答案
    - 用总结段替代场景因果
  perception_source: "每个身份确认、看见、听出和知道都必须有张洞当场可获得的来源；边界阻断时只写碎片，不替人物补全。"

prose:
  governing_principle: "清楚不等于齐全，也不等于每句都必须推动剧情。正文保留会改变张洞注意、判断、关系或动作的事实，也允许少量只建立人物声纹、生活基线、社会质地或误判来源的内容。"
  lived_pov: "关键选择前后，让一个具体欲望、私人联想、羞耻或误判改变他观察事物的先后；不另写完整心理分析，也不在事后替动作总结意义。"
  thought_texture: "允许临场猜测、自我修正、口语化念头和不够漂亮的推理；人物只需想清下一步，不必替作者整理成完整规则。"
  detail_selection: "优先选择人物当时真会注意的细节；它可以承载生活或压力，不要求二者兼有，也不要求后来成为线索。物件应被使用、嫌弃、舍不得或忽略，不按人物、门窗、手脚、声音逐项盘点。"
  ordinary_counterweight: "饭食、手艺、钱账、体面、玩笑与小争执构成恐怖的正常基线；保留能暴露人物并被异常侵入的日常，不为维持阴冷删光生活。"
  scene_axis: "一场戏由一个当下主要未知或利益冲突统领；多条证据服务同一问题，反例出现后再改变问题种类或行动目标。"
  era_texture: "时代感来自使用中的行当、钱、路、饭、债、人情和物件；只负责显得古旧的名词与书面腔删去。"
  spatial_economy: "首次建立关键边界与相对位置，状态不变时不重复播报；只有开合、遮挡、越界或站位真正改变选择时才再次落笔。"
  measurement: "半尺、两步、左门扇等精确量只在人物确实会估量且该量影响当下行动时使用；能用自然焦点一次读懂时，不把院落写成丈量图。"
  movement: "无歧义的普通走动可以省略中间步骤，落笔在出发原因、受阻处或抵达后的变化；危险边界和异常反例仍须写清前态与后态。"
  rhythm: "长短句随压力变化而起伏；短句用于判断落地、动作突变和余震，不把每个动作拆成同长度的独立镜头。"
  reference: "同一人物连续掌握段落焦点时自然使用代词、省略主语或关系称呼；避免为了绝对无歧义反复堆叠‘张洞、父亲、叔公’。"
  dialogue: "对白先暴露人物想得到什么、怕承认什么或故意避开什么，再承担必要信息；删去只为复述现场状态和规则账本的问答。"
  restraint: "克制是压住解释而不是压平人物。重大损失之后允许失态、迁怒、走神、嘴硬或做错小事，只要反应来自人物且改变后续动作。"
  polish_limit: "不追求句句像成稿警句。直白、重复、跑题和改口只要来自人物的认知、关系或说话习惯即可保留，不要求立即带来新动作；机械复述作者结论和累计遮住主问题的填充仍须删除。"
  causal_slack: "允许少量细节、玩笑和误解不承担伏笔、规则或转折功能，也不在章末补用途。真实感来自人物有限认知造成的偏斜，不来自随机错字和无动机矛盾。"

horror:
  source:
    - 熟悉的人、声音、身份或空间突然不能再被信任
    - 异常等待、学习、抢先抵达或反用人物刚建立的验证办法
    - 人物只能在两个都会损伤重要之物的选择之间行动
    - 原本安全的选择被逐层取消，且异常与伤害的距离持续缩短
  description:
    - 每场选择两三项最有效证据，不套固定感官顺序
    - 高潮用短而清楚的事实定格
    - 未知部分保留空白，不靠形容词宣布恐怖
    - 局部规律只解释到足以行动，不把异常完整命名、分类和祛魅
    - 允许日常、幽默和无效争执形成低谷；恐怖靠安全判断被夺走形成波形，不维持恒定阴冷
    - 每次升级改变安全判断或行动机制，不以增加怪声、尸体和黑暗冒充升级
    - 规则认知发生在逃生、救人和关系冲突中，不暂停危险做实验报告

character:
  zhang_dong_early: 约十七岁的谨慎普通人；会怕、会怨、会嘴硬，也会在现实压力下逐步形成冷静与决断
  motivation: 行动落到亲缘、旧债、共同风险、交换、自保或被迫选择
  emotion: 通过物件、距离、称呼、饭食、账目和决定的变化显现
  dialogue: 每人有不同句长、现实关切和回避方式；允许服务当下读者的口语、吐槽和可传播短句，但不能抹平人物差异
  shock_response: 死亡、疑似死者声音或不可能归来首次进入认知时，必须打断人物原动作或判断；其后两至三次反应要与冲击相称，不直接滑入程序化问答
  naming: 使用人物正式名或关系自然产生的称呼；不从归档旧稿继承周秀兰等姓名约束，也不为时代感强塞生硬亲属敬称

blocking:
  first_read_rule: 门窗、门缝、门闩、站位、移动和视线必须能在第一次阅读中重建
  visibility_rule: 身份识别受开口大小、光线、距离与遮挡约束；声音识别和视觉识别不可混写
  state_once_rule: "场景建立后的稳定状态交给读者记忆，不因 Reviewer 需要核账就在每个段落重复门扇、木栓、左右和距离。"
  action_rule: "会改变边界状态、可见范围、人物选择或异常判断的移动与开合必须有可见动作；无歧义的普通过渡可以压缩。灵异造成的不可能转移可保留未知过程，但正文必须写清转移前态、转移后态、视线中断窗口和已知普通通路。"
  audit_separation: "精确站位图、未采用的普通解释和连续性核算写进幕后审查，不得全部显影为人物逐项检查或叙述逐步播报。"

anti_ai:
  hard:
    - 不复制原著或近期章节的完整段落、标志性句子和开场结构
    - 不使用现代组织、技术和网络语汇
    - 不让未解锁能力以直觉或气势变相出现
  warnings:
    - 连续同构短句和整齐列举
    - 频繁使用“不是……而是……”
    - 破折号代替正常句法
    - 段尾总结人物已经做出的动作
    - 抽象情绪标签
    - 固定身体反应和固定离场动作
    - 所有人物都说半句话或故作沉默
    - 每章使用相同钩子构型
    - 为证明空间无漏洞而反复播报门扇、门栓、左右、步数和人物站位
    - 叙述只有外部动作与可核验事实，没有被人物欲望筛选过的注意力
    - 连续使用人物全名或亲属称谓作句首，形成“人物名＋动作”的记录体
    - 对白只负责问状态、报信息、下指令，角色之间没有回避、误解和私人算盘
    - 把克制写成所有人反应微弱、语气一致、永远做现场最优选择
    - 每件物品都成为证据、每句玩笑都服务反差、每段闲谈都精准回收，显露作者施工线
    - 连续用“有人说、另一个问、还有人答”代替多人现场；关键声音应直接呈现，重复噪声才概括争论走势或可见反应
  stock_phrases:
    - 深吸一口气
    - 紧握拳头
    - 眼中闪过
    - 嘴角上扬
    - 空气仿佛凝固
    - 命运的齿轮
    - 这意味着
    - 值得注意的是

pacing:
  chapter_chars: {safe_min: 2500, target_min: 3200, target_max: 5000, safe_max: 8000}
  scenes: "2-4个必要场景；章节必须有一次不可逆转折。场景可承担准备、阻力、关系显影或余波，但离场后必须改变压力、信息或人物关系。"
  exposition: "连续解释尽量少于200字，并由动作、争执、人物欲望或新证据打断"
  ending: "钩子来自已发生的因果，不凭空投放新威胁"
  opening: "从正在失败的行动、交易、期限或异常打断处进入；不以库存清点和背景说明预热"
  opening_genre_signal: "第一章前五分之一内让核心异常或主谜题侵入人物现实困境；不先完整写完一场普通交易再进入类型故事"
  protagonist_ownership: "张洞每章至少亲自作出一次改变局势且带代价的选择，不能只检查、记录或总结长辈决定"
  cost_realization: "核心选择的代价须在本章由张洞本人实际支付；他人误工和未来可能性不能替代"
  question_progression: "最初问题在章内得到局部回答、反例或后果，并升级为不同且更贴身的问题"
  serial_pull: "结尾改变下一步行动条件；静物、怪声或以后再查本身不构成强钩子"
  ending_leverage: "章末行动必须能覆盖已建立的路线并实际影响对手、证物或结果；无效守夜和空泛赶去不算钩子"

repetition:
  compare_recent_chapters: 5
  exact_paragraph: P1
  identical_long_sentence_total_3: P1
  repeated_action_or_hook: P2；明显结构复刻升级为P1
